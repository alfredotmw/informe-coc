<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Informe diario de agenda — COC</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:wght@400&display=swap" rel="stylesheet">
</head><body><div id="dash-root"><p style="font-family:system-ui,sans-serif;color:#667085;padding:40px 16px;text-align:center">Cargando informe…</p></div>
<script>
// La página y los datos los publica el Apps Script "Informe COC" (se actualiza cada hora).
(function () {
  var U = 'https://script.google.com/macros/s/AKfycbxRFT_0WiRQIKCWEpWqLU0pxHVXgO0WuBB7VQM1KkuE3y9LOUyVTZMjxtkuO9H3KuCyBw/exec';
  var root = document.getElementById('dash-root');
  fetch(U + '?v=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !j.pagina) throw new Error('sin página');
    window.__DATOS = j;
    root.innerHTML = j.pagina;
    root.querySelectorAll('script').forEach(function (o) { var s = document.createElement('script'); s.textContent = o.textContent; o.replaceWith(s); });
  }).catch(function () {
    root.innerHTML = '<p style="font-family:system-ui,sans-serif;color:#667085;padding:40px 16px;text-align:center">No se pudo cargar el informe. Probá recargar la página en unos minutos.</p>';
  });
})();
</script>
</body></html>
